<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search - MemeBro</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Geist, system-ui, sans-serif;
      }

      #search-root {
        min-height: 100vh;
      }
    </style>
    <script type="module" src="../js/components/search.js"></script>
  </head>
  <body>
    <script>
      // Apply the saved theme (or the OS preference) before the page paints so
      // it never flashes the wrong theme. Persistence lives in js/theme.js.
      try {
        const saved = JSON.parse(localStorage.getItem("memebro:theme"));
        const dark =
          saved === "dark" ||
          (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <main id="search-root">
      <memebro-search></memebro-search>
    </main>
  </body>
</html>

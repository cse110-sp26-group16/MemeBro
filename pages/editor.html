<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor - MemeBro</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
      }
      #editor-root {
        display: flex;
        flex-direction: column;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      memebro-editor {
        width: 100%;
      }
    </style>
    <script type="module" src="../js/components/editor.js"></script>
  </head>

  <body>
    <script>
      // Apply the saved theme (or the OS preference) before the page paints so
      // it never flashes the wrong theme. Persistence lives in js/theme.js.
      try {
        const saved = JSON.parse(localStorage.getItem("memebro:theme"));
        const dark =
          saved === "dark" ||
          (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <main id="editor-root">
      <memebro-editor></memebro-editor>
    </main>
  </body>
</html>

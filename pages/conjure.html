<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conjure - MemeBro</title>
    <link rel="stylesheet" href="conjure.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <button class="back-btn" title="Back">←</button>
        <div class="header-title">conjure ✦</div>
        <div class="credits">4/5 CREDITS</div>
      </div>

      <div class="prompt-section">
        <textarea
          class="prompt-input"
          placeholder="shrek pondering on orb in a dark room"
        ></textarea>
      </div>

      <div class="reference-section">
        <div class="reference-text">↓ tap to add reference image</div>
      </div>

      <div class="style-section">
        <div class="section-label">STYLE</div>
        <div class="style-grid">
          <button class="btn active">photo</button>
          <button class="btn">painted</button>
          <button class="btn">3d render</button>
          <button class="btn">vintage</button>
          <button class="btn">screenshot</button>
          <button class="btn">cartoon</button>
        </div>
      </div>

      <div class="layout-section">
        <div class="section-label">LAYOUT</div>
        <div class="layout-grid">
          <button class="btn">1-panel</button>
          <button class="btn">2-panel</button>
          <button class="btn">4-panel</button>
        </div>
      </div>

      <button class="generate-btn">✦ generate 4</button>
    </div>
  </body>
</html>
